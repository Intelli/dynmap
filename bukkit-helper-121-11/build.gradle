eclipse {
    project {
        name = "Dynmap(Paper-1.21.11)"
    }
}

description = 'bukkit-helper-1.21.11'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = JavaLanguageVersion.of(21)

dependencies {
  implementation project(':bukkit-helper')
  implementation project(':dynmap-api')
  implementation project(path: ':DynmapCore', configuration: 'shadow')
  compileOnly('io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT')
  compileOnly('org.spigotmc:spigot:1.21.11-R0.1-SNAPSHOT') {
    exclude group: 'com.mojang', module: 'jtracy'
  }
}
