plugins {
    id  "com.gradleup.shadow" version "9.4.1"
    id  "io.papermc.paperweight.userdev" version "2.0.0-beta.24" apply false
    id  'java'
    id  'maven-publish'
}

apply plugin: 'eclipse'

eclipse {
    project {
        name = "Dynmap"
    }
}

allprojects  {
  repositories {
     mavenLocal {
       // Paper's published Gradle metadata carries its transitive BOM constraints.
       content { excludeVersionByRegex('io.papermc.paper', 'paper-api', '.*\\.build\\..*') }
     }
     maven { url 'https://libraries.minecraft.net/' }
     maven { url "https://oss.sonatype.org/content/repositories/releases" }
     maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
     maven { url "https://repo.mikeprimm.com" }
     maven { url "https://repo.maven.apache.org/maven2" }
     maven { url "https://repo.papermc.io/repository/maven-public/" }
     maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
     maven { url "https://repo.codemc.org/repository/maven-public/" }
  }

  apply plugin: 'java'
  
  group = 'us.dynmap'
  version = '3.9-SNAPSHOT'

}

class Globals {
  String buildNumber =  System.getenv().BUILD_NUMBER ?: "Dev"
}
ext {
  globals = new Globals()
  paperVersion = '26.3.build.206-stable'
}

subprojects {  
  apply plugin: "com.gradleup.shadow"
  apply plugin: 'java'
  apply plugin: 'maven-publish'

  java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
  }
  if (!project.name.startsWith('bukkit-helper-26') && !project.name.startsWith('bukkit-helper-121')) {
    java.sourceCompatibility = JavaVersion.VERSION_1_8
    java.targetCompatibility = JavaVersion.VERSION_1_8
  }
  tasks.withType(JavaCompile) {
  	options.encoding = 'UTF-8'
  }
}

clean {
  delete "target" 
}

task setupCIWorkspace {
}
