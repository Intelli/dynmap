
description = 'dynmap'

eclipse {
    project {
        name = "Dynmap(Paper)"
    }
}

repositories {
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url 'https://repo.codemc.org/repository/maven-releases/'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
java.sourceCompatibility = java.targetCompatibility = JavaVersion.VERSION_25

dependencies {
    compileOnly("io.papermc.paper:paper-api:${rootProject.ext.paperVersion}")
    compileOnly('net.luckperms:api:5.0')  { transitive = false }
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }
    compileOnly('net.skinsrestorer:skinsrestorer-api:14.2.+')  { transitive = false }
    implementation(project(":dynmap-api"))  { transitive = false }
    implementation(project(path: ":DynmapCore", configuration: "shadow"))  { transitive = false }
    implementation group: 'org.bstats', name: 'bstats-bukkit', version: '3.0.2'
    compileOnly('com.googlecode.json-simple:json-simple:1.1.1') { transitive = false }
    compileOnly('com.google.code.gson:gson:2.8.9') { transitive = false }
    implementation(project(':bukkit-helper')) {
        transitive = false
    }
    implementation(project(':bukkit-helper-121-10')) {
        transitive = false
    }
    implementation(project(':bukkit-helper-121-11')) {
        transitive = false
    }
    implementation(project(':bukkit-helper-26-1-2')) {
        transitive = false
    }
    implementation(project(':bukkit-helper-26-3')) {
        transitive = false
    }
}

processResources {
    // replace stuff in mcmod.info, nothing else
    filesMatching('plugin.yml') {
        // replace version and mcversion
        expand(
                buildnumber: project.parent.ext.globals.buildNumber,
                version: project.version,
                apiVersion: '26.3'
        )
    }
}

jar {
    archiveClassifier = 'unshaded'
}

shadowJar {
    dependencies {
        include(dependency('org.bstats:.*:.*'))
        include(dependency(':dynmap-api'))
        include(dependency(":DynmapCore"))
        include(dependency(':bukkit-helper'))
        include(dependency(':bukkit-helper-121-10'))
        include(dependency(':bukkit-helper-121-11'))
        include(dependency(':bukkit-helper-26-1-2'))
        include(dependency(':bukkit-helper-26-3'))
    }
    relocate('org.bstats', 'org.dynmap.bstats')
    destinationDirectory = file '../target'
    archiveFileName = 'Dynmap-Paper-26.3.jar'
    manifest {
        attributes('paperweight-mappings-namespace': 'mojang')
    }
}
shadowJar.doLast {
    task ->
        ant.checksum file: task.archiveFile.get().asFile
}

def pluginJar = tasks.named('shadowJar').flatMap { it.archiveFile }
def verifyPluginJar = tasks.register('verifyPluginJar') {
    group = 'verification'
    description = 'Checks required bundled libraries and loads the relocated bStats chart classes.'
    dependsOn tasks.named('shadowJar')
    inputs.file(pluginJar)
    doLast {
        File archive = pluginJar.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            [
                'org/dynmap/bukkit/helper/v26_3/BukkitVersionHelperSpigot26_3.class',
                'org/dynmap/bstats/bukkit/Metrics.class',
                'org/dynmap/bstats/MetricsBase.class',
                'org/dynmap/bstats/charts/CustomChart.class',
                'org/dynmap/bstats/charts/SimplePie.class',
                'org/dynmap/bstats/charts/DrilldownPie.class',
                'org/dynmap/jetty/server/Server.class',
                'org/dynmap/javax/servlet/Servlet.class',
                'org/dynmap/snakeyaml/Yaml.class'
            ].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("Missing bundled class in ${archive.name}: ${name}")
                }
            }
            // Isolate the archive from Gradle's dependencies so missing relocated classes fail here.
            new URLClassLoader([archive.toURI().toURL()] as URL[], ClassLoader.getPlatformClassLoader()).withCloseable { loader ->
                zip.entries().each { entry ->
                    if (entry.name.startsWith('org/dynmap/bstats/') &&
                        !entry.name.startsWith('org/dynmap/bstats/bukkit/') &&
                        entry.name.endsWith('.class')) {
                        String name = entry.name.substring(0, entry.name.length() - 6).replace('/', '.')
                        Class.forName(name, false, loader).getDeclaredMethods()
                    }
                }
            }
        }
        logger.lifecycle("Verified bundled libraries and bStats class loading in ${archive.name}")
    }
}

tasks.named('check') {
    dependsOn verifyPluginJar
}

artifacts {
    archives shadowJar
}
