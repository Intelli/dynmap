apply plugin: 'eclipse'

eclipse {
    project {
        name = "Dynmap(Spigot-Common)"
    }
}

description = 'bukkit-helper'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = JavaLanguageVersion.of(17)

dependencies {
  implementation project(':dynmap-api')
  implementation project(path: ':DynmapCore', configuration: 'shadow')
  compileOnly group: 'org.spigotmc', name: 'spigot-api', version:'1.21.10-R0.1-SNAPSHOT'
  compileOnly group: 'com.google.code.gson', name: 'gson', version:'2.8.9'
}
